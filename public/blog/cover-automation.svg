    <g transform="translate(320,210)">
      <rect width="120" height="60" rx="14" fill="rgba(255,255,255,0.14)" stroke="rgba(253,230,138,0.5)"/>
      <text x="60" y="36" text-anchor="middle" font-size="13" fill="#fff7e9">Filter</text>
    </g>
    <g transform="translate(520,370)">
      <rect width="120" height="60" rx="14" fill="rgba(255,255,255,0.14)" stroke="rgba(253,230,138,0.5)"/>
      <text x="60" y="36" text-anchor="middle" font-size="13" fill="#fff7e9">Transform</text>
    </g>
    <g transform="translate(720,250)">
      <rect width="120" height="60" rx="14" fill="rgba(255,255,255,0.14)" stroke="rgba(253,230,138,0.5)"/>
      <text x="60" y="36" text-anchor="middle" font-size="13" fill="#fff7e9">Notify</text>
    </g>
    <g transform="translate(920,250)">
      <rect width="140" height="60" rx="14" fill="#0f766e" stroke="#fde68a" stroke-width="2"/>
