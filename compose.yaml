name: portfolio-backend
services:
  database:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Database name is required}
      POSTGRES_USER: ${DB_USERNAME:?Database user is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password is required}
    volumes:
      - portfolio-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3052
      TRUST_PROXY_HOPS: "1"
      DB_HOST: database
      DB_PORT: 5432
      DB_AUTO_CREATE: "false"
      DB_AUTO_SYNC: ${DB_AUTO_SYNC:-false}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:3052:3052"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3052/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
volumes:
  portfolio-data:
